name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  db:
    name: Migrations e testes de banco
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cartori_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cartori_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/cartori_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Papéis da Data API (anon, authenticated, service_role)
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/init-roles.sql
      - run: npm run db:test:migrate
      - name: Schema e migrations sem divergência
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ env.TEST_DATABASE_URL }}
        run: npx prisma migrate diff --from-url "$TEST_DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run test:db
