# Postgres descartável para testes de integração. Nunca aponte testes para o Supabase.
name: cartori-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cartori_test
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./tests/db/init-roles.sql:/docker-entrypoint-initdb.d/00-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cartori_test"]
      interval: 1s
      timeout: 3s
      retries: 30
